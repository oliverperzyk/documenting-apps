# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Workflow to validate the whole repository's codebase projects.
---
name: Continuous Integration.
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches-ignore:
            - "*-disabled"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
defaults:
    run:
        shell: bash
jobs:
    validate:
        name: Validate whole repository's codebase.
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository.
              uses: actions/checkout@v7
            - name: Set up Bun.
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - name: Cache Bun dependencies.
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-
            - name: Install dependencies.
              run: bun install --frozen-lockfile
            - name: Check formatting with Prettier and clang-format.
              run: bun run format:check
            - name: Lint JSON and Markdown files using ESLint.
              run: bun run lint
            - name: Check submission bundler.
              run: bun run test:bundle
