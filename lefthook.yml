pre-commit:
  parallel: true
  commands:
    lint-staged:
      run: bunx lint-staged
    format-cpp:
      glob: "*.{c,cc,cpp,cxx,h,hh,hpp,hxx}"
      run: bun run format-cpp
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    format-json-md:
      run: bunx prettier --check "**/*.{json,json5,jsonc,md}"
    format-cpp:
      run: bun run format-cpp:check
    lint:
      run: bun run lint

commit-msg:
  commands:
    conventional-commits:
      run: scripts/commit-msg.sh {1}
